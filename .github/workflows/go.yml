name: Go tests and checking

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Run tests
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # shell: bash is load-bearing: the default Windows shell (pwsh) only
      # propagates the LAST command's exit code, which would let a failing
      # `go build` report success when `go vet` follows it.
      - name: Build (CGO-free)
        shell: bash
        run: |
          set -euo pipefail

          # Assert the CGO-free configuration instead of only printing it: a dropped
          # job-level env, a setup-go change, or a later step-level override must
          # fail here rather than let the proof silently regress.
          cgo=$(go env CGO_ENABLED)
          echo "CGO_ENABLED=$cgo"
          if [ "$cgo" != "0" ]; then
            echo "::error::CGO_ENABLED=$cgo, expected 0 (the CGO-free proof is not being exercised)"
            exit 1
          fi

          go build ./...
          go vet ./...

          # Assert the pure-Go driver modules resolve to a pinned version, so swapping
          # in a cgo-backed driver cannot keep this step green.
          pins=$(go list -m modernc.org/sqlite modernc.org/libc)
          echo "$pins"
          for mod in modernc.org/sqlite modernc.org/libc; do
            if ! printf '%s\n' "$pins" | grep -q "^${mod} v"; then
              echo "::error::${mod} did not resolve to a pinned version; the CGO-free driver proof is broken"
              exit 1
            fi
          done

      - name: Build swapper binaries
        run: make swapper

      - name: Run tests
        run: go test -v ./...

      - name: SQLite two-process E2E
        run: go test -tags=e2e -run 'TestTwoProcess' ./cache/sqlite/ -v -count=1 -timeout=180s

      # The driver is pure Go, but -race is a cgo build mode on every non-darwin
      # OS, so this step re-enables cgo inside an otherwise CGO-free job; the
      # Linux and macOS runners ship the required C toolchain (CONC-03).
      # Enabling -race on Windows (mingw setup) stays a reviewer-flagged
      # follow-up for a future phase.
      - name: SQLite race detector
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./cache/sqlite/ -count=1 -timeout=180s

  coverage:
    name: Go test coverage check
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3

      - name: Build swapper binaries
        run: make swapper

      - name: generate test coverage
        run: go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: cover.out
          threshold-total: 75

          ## when token is not specified (value '') this feature is turned off
          ## in this example badge is created and committed only for main branch
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          ## name of branch where badges are stored
          ## ideally this should be orphan branch (see below how to create this branch)
          git-branch: badges
